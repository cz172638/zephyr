CONFIG_DISK_ACCESS=y
# 128 KiB per command; the AHCI bounce buffer of the same size moves it in
# one ATA command
CONFIG_PCIE_EPF_NVME_MDTS_KB=128
CONFIG_AHCI_BOUNCE_SECTORS=256
CONFIG_PCIE_EPF_NVME_MAX_IO_QUEUES=4
CONFIG_PCIE_EPF_NVME_MAX_NAMESPACES=5
# the namespaces belong to the host: never format or mount them here
CONFIG_FS_FATFS_MOUNT_MKFS=n
# the function that binds unless "pcie controller ep function" saved another
CONFIG_PCIE_EPF_DEFAULT_FUNCTION="nvme"
