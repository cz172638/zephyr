CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_AHCI=y
# the board's SD slot comes along (DISK_DRIVER_SDMMC), it needs the regulator
CONFIG_REGULATOR=y
# FAT/exFAT on the disk (first partition or a superfloppy): fs mount fat /sata0:
# Never formats on mount: a disk with other data stays untouched.
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="sata0,nvme0n0"
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=2
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_MAX_SS=4096
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_SHELL_TEST_COMMANDS=y
CONFIG_FILE_SYSTEM_SHELL_BUFFER_SIZE=0x10000
CONFIG_FILE_SYSTEM_SHELL_TIMING=y
CONFIG_SHELL_STACK_SIZE=24576
CONFIG_HEAP_MEM_POOL_SIZE=131072
CONFIG_FS_FATFS_LBA64=y
