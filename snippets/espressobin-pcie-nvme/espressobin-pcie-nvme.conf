# NVMe after the root complex has enumerated (PCIE_AARDVARK_INIT_PRIORITY)
CONFIG_NVME_INIT_PRIORITY=88
CONFIG_NVME_IO_QUEUES=1
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
# the board's SD slot comes along (DISK_DRIVER_SDMMC), it needs the regulator
CONFIG_REGULATOR=y
# FAT on the namespace: fs mkfs fat /nvme0n0: ; fs mount fat /nvme0n0:
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="nvme0n0"
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_SHELL_TEST_COMMANDS=y
CONFIG_FILE_SYSTEM_SHELL_BUFFER_SIZE=0x4000
CONFIG_FILE_SYSTEM_SHELL_TIMING=y
CONFIG_SHELL_STACK_SIZE=24576
CONFIG_HEAP_MEM_POOL_SIZE=65536
