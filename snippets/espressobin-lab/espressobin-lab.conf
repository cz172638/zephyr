CONFIG_LAB_AGENT=y
CONFIG_LLEXT=y
CONFIG_LLEXT_HEAP_SIZE=1024
CONFIG_LLEXT_SHELL=y
CONFIG_LLEXT_SHELL_MAX_SIZE=65536
CONFIG_LLEXT_LOG_LEVEL_INF=y
CONFIG_LLEXT_EXPORT_DEVICES=y
# image number: modules are <image>-<name>.llext and must match it
CONFIG_LAB_IMAGE=150
# debug commands that are modules in lab builds (lab mod load)
CONFIG_PCIE_EPC_AARDVARK_IRQTEST=n
CONFIG_PCIE_EPC_AARDVARK_XORTEST=n
