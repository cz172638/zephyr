CONFIG_PCIE_ENDPOINT=y
# Outbound window (16 MiB) and BAR carveout are mapped at run time
CONFIG_KERNEL_VM_SIZE=0x8000000
CONFIG_MAX_XLAT_TABLES=48
# devmem: SoC registers outside the controller (IO decode windows)
CONFIG_DEVMEM_SHELL=y
# Device Serial Number generated once and kept in settings (needs
# CONFIG_SETTINGS from the application, the netshell has it)
CONFIG_PCIE_EPC_DSN_SETTINGS=y
# Root complex as well, the role from settings: "advk mode rc|ep" + reboot.
# The RC driver drives PERST# through the SB GPIO controller.
CONFIG_PCIE=y
# controller-neutral "pcie" shell (PCIE_CTRL_SHELL) instead of the generic one
CONFIG_PCIE_SHELL=n
CONFIG_GPIO=y
