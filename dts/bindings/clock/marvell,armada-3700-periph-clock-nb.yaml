description: |
  Marvell Armada 37xx north bridge peripheral clocks (gates only).
  The cell is the index of the clock in the Linux armada-37xx-periph table.

compatible: "marvell,armada-3700-periph-clock-nb"

include: [clock-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#clock-cells":
    const: 1

clock-cells:
  - index
