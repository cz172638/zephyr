title: Rockchip RK3308 CRU

description: |
  Rockchip RK3308 Clock and Reset Unit (CRU) register block. A child node
  provides the clock gate controller interface.

compatible: "rockchip,rk3308-cru"

include: base.yaml

properties:
  reg:
    required: true

child-binding:
  description: Clock controller sharing the CRU register block.
