description: |
  Marvell Armada 3700 (Aardvark) PCIe controller in endpoint mode.

  The COMPHY lane is powered through the TF-A SiP service
  MV_SIP_COMPHY_POWER_ON; the PHY's 100/125 MHz clock output it enables
  is switched off again, the endpoint runs on its own reference clock.

compatible: "marvell,armada-3700-pcie-ep"

include: [pcie-ep-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  reg-names:
    required: true
    description: |
      "ctrl": controller registers, "mem": the AXI range decoded to PCIe,
      used for outbound windows (power of two sized and aligned),
      "comphy": COMPHY lane 1 registers (PHY clock output).

  clocks:
    required: true

  interrupts:
    description: Controller interrupt (not used yet, the driver polls).

  perst-gpios:
    type: phandle-array
    description: |
      PERST# from the host. The controller's PCIE_RESETn pin is an output,
      so it has to come in through a GPIO. Without it training is enabled
      once and the link state is polled.

  marvell,comphy-lane:
    type: int
    default: 1
    description: COMPHY lane carrying PCIe (lane 1 on the A3720).

  marvell,comphy-polarity-invert:
    type: int
    default: 0
    enum: [0, 1, 2, 3]
    description: COMPHY polarity inversion, bit 0 TX, bit 1 RX.

  marvell,refclk-in:
    type: boolean
    description: |
      Switch the REFCLK pins to input (common clock from the host).
      Default is the setup known to work: REFCLK not connected, the
      PHY's clock output off, each side on its own reference.

  memory-region:
    type: phandle
    description: |
      The DDR range inbound TLPs may reach, normally the functions' BAR
      backing store: the PCIe IO decode window is set to exactly this
      range (base and size in 64 KiB units), the host gets a completer
      abort anywhere else. Without it the window is DDR 0 up to
      CONFIG_PCIE_EPC_AARDVARK_INBOUND_LIMIT.

  marvell,comphy-skip:
    type: boolean
    description: Do not call the COMPHY SiP service (debugging).
