description: |
  Marvell Xenon SD host controller of the Armada 3700: SDHCI v3 slot with
  Xenon system registers and eMMC PHY. The second register is the SoC pad
  control of the slot (0: 3.3 V, 1: 1.8 V IO pads).

compatible: "marvell,armada-3700-sdhci"

include: [sdhc.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true
    description: Controller registers, then the SoC pad control register.

  reg-names:
    required: true
    description: '"base", "pad"'

  interrupts:
    required: true

  clocks:
    required: true

  bus-width:
    type: int
    default: 4
    enum: [1, 4, 8]

  non-removable:
    type: boolean
    description: Soldered device (eMMC), always present.

  cd-gpios:
    type: phandle-array
    description: Card detect GPIO.

  vqmmc-supply:
    type: phandle
    description: |
      Regulator of the IO voltage. Without one the slot signals at 3.3 V
      only (no UHS).

  marvell,pad-type:
    type: string
    default: "sd"
    enum:
      - "sd"
      - "fixed-1-8v"
    description: |
      "sd": pads at 3.3 V, 1.8 V after a voltage switch; "fixed-1-8v":
      eMMC on 1.8 V pads.

  no-1-8-v:
    type: boolean
    description: |
      Do not offer 1.8 V signalling (no UHS voltage switch) even with a
      vqmmc-supply.
