description: |
  Synopsys DesignWare Mobile Storage Host (dw_mmc) as the RK3399 SDMMC
  slot. The CIU clock is the CRU clock divided by 2 inside the SoC.

compatible: "rockchip,rk3399-dw-mshc"

include: [sdhc.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    description: Must be "biu" (AHB), "ciu" (card clock source).

  bus-width:
    type: int
    default: 4
    enum: [1, 4, 8]

  broken-cd:
    type: boolean
    description: No card detect; the card is assumed present.

  rockchip,grf:
    type: phandle
    description: GRF syscon; the driver clears GRF_SOC_CON7.force_jtag.

  rockchip,sd-jtag:
    type: boolean
    description: |
      JTAG through the micro SD slot: GRF_SOC_CON7.force_jtag stays set
      (JTAG on the pins while card detect says no card), and a breakout
      that card detect takes for a card (no command answered after
      power-on) gets the pins muxed to JTAG by hand. Without it,
      force_jtag is cleared. Needs rockchip,grf.
