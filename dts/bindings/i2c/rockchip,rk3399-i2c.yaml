description: Rockchip RK3399 I2C controller

compatible: "rockchip,rk3399-i2c"

include: [i2c-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    description: |
      "i2c" for the controller input clock, "pclk" for the bus clock.
