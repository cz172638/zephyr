description: |
  Internal MDIO bus of a Marvell 88E6xxx switch. Must be a child of the
  switch node; the internal PHYs are its children, at the addresses the
  switch uses for them (0x10 + port number on the 88E6341/6390 families).

    switch0: ethernet-switch@1 {
        compatible = "marvell,mv88e6085";
        ...
        mdio {
            compatible = "marvell,mv88e6xxx-mdio";
            #address-cells = <1>;
            #size-cells = <0>;

            switch0phy1: ethernet-phy@11 {
                compatible = "ethernet-phy";
                reg = <0x11>;
            };
        };
    };

compatible: "marvell,mv88e6xxx-mdio"

include: mdio-controller.yaml
