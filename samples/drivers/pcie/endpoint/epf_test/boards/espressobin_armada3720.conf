# No CONFIG_GPIO: a PERST# GPIO (perst-gpios) needs it, but the GPIO
# driver is a suspect of the SD image boot loop, so it stays off until
# that is understood.
# Outbound window (16 MiB) and BAR carveout are mapped at run time
CONFIG_KERNEL_VM_SIZE=0x8000000
CONFIG_MAX_XLAT_TABLES=48
# Bring-up: init checkpoints and logs as they happen
CONFIG_PCIE_EPC_AARDVARK_TRACE_INIT=y
CONFIG_LOG_MODE_IMMEDIATE=y
# printk straight to the UART: the shell log backend starts after the
# drivers, early output would be lost
CONFIG_LOG_PRINTK=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
# Scripted from the host over the serial console: room for the probe
# commands, plain output, reboot from the shell
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_SHELL_VT100_COLORS=n
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y
# Update the image over the console (YMODEM), no network in this image
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y
CONFIG_FWUPDATE=y
# devmem: poke SoC registers outside the controller (IO decode windows)
CONFIG_DEVMEM_SHELL=y
# Device Serial Number: generated on the first boot, kept in settings
# (NVS in the zephyr-storage partition, shared with the netshell)
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_PCIE_EPC_DSN_SETTINGS=y
