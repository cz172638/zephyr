CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192

# root complex; "pcie controller", "pcie ls", "pcie cfg"
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y

# DBI 4.5 MiB, BARs of the endpoints mapped at run time
CONFIG_KERNEL_VM_SIZE=0x10000000
CONFIG_MAX_XLAT_TABLES=32
