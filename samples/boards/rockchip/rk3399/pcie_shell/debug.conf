# boot debugging: markers between init priorities, logs printed at once
CONFIG_SAMPLE_INIT_TRACE=y
CONFIG_EARLY_CONSOLE=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SDHC_LOG_LEVEL_DBG=y
CONFIG_SD_LOG_LEVEL_DBG=y
CONFIG_PCIE_EP_LOG_LEVEL_DBG=y
CONFIG_SPI_LOG_LEVEL_DBG=y
# printk and logs straight to the UART, not through the shell log backend
# (that one only prints once the shell thread runs)
CONFIG_LOG_PRINTK=n
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y
