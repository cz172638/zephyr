# SSH shell: EXTRA_CONF_FILE=ssh.conf and
# -DCONFIG_PCIE_SHELL_SSH_PASSWORD=\"...\"; ssh root@rockpi4-<mac>.local
CONFIG_SSH_SERVER=y
CONFIG_SSH_SERVER_MAX_CLIENTS=2
CONFIG_SSH_MAX_CHANNELS=2
CONFIG_SSH_MAX_HOST_KEYS=1
CONFIG_MBEDTLS=y
CONFIG_MAIN_STACK_SIZE=16384
# ssh <board> '<command>'
CONFIG_SHELL_SSH_EXEC=y
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_PROMPT_DUMMY=""
CONFIG_HWINFO_SHELL=y
CONFIG_ZVFS_POLL_MAX=10
CONFIG_ZVFS_OPEN_MAX=16
