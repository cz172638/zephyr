CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_REBOOT=y
CONFIG_SHELL_STACK_SIZE=8192

# root complex
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
# endpoint
CONFIG_PCIE_ENDPOINT=y
CONFIG_PCIE_EP_LOG_LEVEL_INF=y
CONFIG_CRC=y
CONFIG_TEST_RANDOM_GENERATOR=y

# config space 32 MiB + outbound 32 MiB + BAR carveout, mapped at run time
CONFIG_KERNEL_VM_SIZE=0x10000000
CONFIG_MAX_XLAT_TABLES=64

# eMMC: boot medium and storage (FAT from 16 MiB, mounted at /EMMC: before
# the PCIe role is read); the micro SD slot
# is left to the JTAG breakout: host only, no SD card disk
CONFIG_SDHC=y
CONFIG_SDHC_INIT_PRIORITY=70
CONFIG_DISK_ACCESS=y
CONFIG_MMC_STACK=y
CONFIG_DISK_DRIVER_MMC=y
CONFIG_FILE_SYSTEM=y
# FAT registered before the eMMC mount (76): default 99 is too late
CONFIG_FILE_SYSTEM_INIT_PRIORITY=74
# the disk drivers on top of the SDHC hosts too (default 90)
CONFIG_SD_INIT_PRIORITY=72
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/EMMC:/settings"
CONFIG_PCIE_ROLE_SETTINGS=y
CONFIG_MAIN_STACK_SIZE=8192

# SPI flash (4A+/4B+/4C): not used for booting; an old image there would
# win over the eMMC (BootROM order), "flash erase" clears it
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_SHELL=y

# "fwupdate ymodem" over the shell UART (tio ctrl-t y): <img>-rock_pi_4-spi.bin
# into the SPI NOR boot_partition, or on a board without SPI NOR
# <img>-rock_pi_4-boot.bin into the eMMC boot area
CONFIG_FLASH_MAP=y
CONFIG_FWUPDATE=y
CONFIG_FWUPDATE_BOOT_DISK=y

# SR-IOV strap: the core shows its SR-IOV capability (VFs not driven yet)
CONFIG_PCIE_EPC_RK3399_SRIOV=y
