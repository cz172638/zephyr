CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_REBOOT=y
CONFIG_SHELL_STACK_SIZE=8192

# root complex
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
# endpoint
CONFIG_PCIE_ENDPOINT=y
CONFIG_PCIE_EP_LOG_LEVEL_INF=y
CONFIG_CRC=y
CONFIG_TEST_RANDOM_GENERATOR=y

# config space 32 MiB + outbound 32 MiB + BAR carveout, mapped at run time
CONFIG_KERNEL_VM_SIZE=0x10000000
CONFIG_MAX_XLAT_TABLES=64

# SPI flash (4A+/4B+/4C): role in settings, flash shell, "spiflash update"
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PCIE_ROLE_SETTINGS=y

# micro SD: FAT on the first partition, mounted at /SD:
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_MAIN_STACK_SIZE=8192
