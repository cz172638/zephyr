CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_REBOOT=y
CONFIG_SHELL_STACK_SIZE=8192

# root complex
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
# endpoint
CONFIG_PCIE_ENDPOINT=y
CONFIG_PCIE_EP_LOG_LEVEL_INF=y
CONFIG_CRC=y
CONFIG_TEST_RANDOM_GENERATOR=y

# config space 32 MiB + outbound 32 MiB + BAR carveout, mapped at run time
CONFIG_KERNEL_VM_SIZE=0x10000000
CONFIG_MAX_XLAT_TABLES=64
