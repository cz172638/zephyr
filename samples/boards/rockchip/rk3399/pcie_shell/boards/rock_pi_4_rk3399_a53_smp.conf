# The endpoint gets CPU1: the test function's command work queue is pinned
# there and an SMP level init routes the endpoint interrupts to it; the
# doorbell LPIs follow the work queue.
CONFIG_SCHED_CPU_MASK=y
CONFIG_PCIE_EPF_TEST_CPU=1

# Scheduler IPIs only to the CPUs that can run the woken thread: without
# this every wakeup of the pinned work queue interrupts all four CPUs.
CONFIG_IPI_OPTIMIZE=y
CONFIG_IPI_OPTIMIZE_IDLE=y
