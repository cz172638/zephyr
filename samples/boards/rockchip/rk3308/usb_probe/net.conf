# Ethernet (RMII + RTL8201F): DHCP, mDNS (rk3308-probe-<mac>.local), the
# shell over SSH. EXTRA_CONF_FILE=net.conf and
# -DCONFIG_USB_PROBE_SSH_PASSWORD=\"...\"; ssh root@rk3308-probe-<mac>.local
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
# first DISCOVER 1..2 s after the link, not up to 10 s (RFC 2131 4.4.1)
CONFIG_NET_DHCPV4_INITIAL_DELAY_MAX=2
CONFIG_NET_SOCKETS=y
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="rk3308-probe"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_NET_SHELL=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_RX_STACK_SIZE=4096
# no TRNG driver for the RK3308 yet: not a source of real entropy
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_HWINFO_SHELL=y

CONFIG_SSH_SERVER=y
CONFIG_SSH_SERVER_MAX_CLIENTS=2
CONFIG_SSH_MAX_CHANNELS=2
CONFIG_SSH_MAX_HOST_KEYS=1
# the channel receive window: with the default 256 bytes, one round trip per
# 128 bytes caps an upload at about 20 kB/s
CONFIG_SSH_CHANNEL_BUF_SIZE=16384
CONFIG_MBEDTLS=y
# RSA key generation in main()
CONFIG_MAIN_STACK_SIZE=16384
# ssh <probe> '<command>'
CONFIG_SHELL_SSH_EXEC=y
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_PROMPT_DUMMY=""
CONFIG_ZVFS_POLL_MAX=10
CONFIG_ZVFS_OPEN_MAX=16
