CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="RK3308 lab probe"
CONFIG_SAMPLE_USBD_MAX_POWER=250

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_UART_BRIDGE_BUF_SIZE=4096

# probe shell on the first CDC ACM port, log on the console UART
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_KERNEL_SHELL=y
CONFIG_DEVMEM_SHELL=y
# log off for now: with it on, nothing reaches UART0 on this board
CONFIG_LOG=n

# "kernel reboot": PSCI SYSTEM_RESET
CONFIG_REBOOT=y

# micro SD: FAT partition mounted at /SD:, the boot area (MBR, idbloader at
# sector 64, FIT at sector 16384) written by "fwupdate ymodem"
CONFIG_SDHC=y
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STACK=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
# mkfs over the whole card would cover the boot area
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FWUPDATE=y
CONFIG_FWUPDATE_BOOT_DISK=y
CONFIG_FWUPDATE_BOOT_DISK_NAME="SD"
# up to the end of a FIT of at most 1 MiB at sector 16384
CONFIG_FWUPDATE_BOOT_DISK_SIZE=0x900000
CONFIG_MAIN_STACK_SIZE=4096

# "cpu freq": core clock with vdd_core (PWM regulator)
CONFIG_PWM=y
CONFIG_REGULATOR=y
