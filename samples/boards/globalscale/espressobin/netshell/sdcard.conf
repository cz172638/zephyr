# microSD (Xenon SDHC) with FAT and the fs shell:
#   -DEXTRA_CONF_FILE=sdcard.conf (with router.conf/gptp.conf: ";"-separated)
#   fs mount fat /SD: ; fs ls /SD:
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_REGULATOR=y
# fs mount needs the kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=16384
# fs read_test / erase_write_test with speed
CONFIG_FILE_SYSTEM_SHELL_TEST_COMMANDS=y
# the test buffer lives on the shell stack
CONFIG_FILE_SYSTEM_SHELL_BUFFER_SIZE=0x4000
CONFIG_SHELL_STACK_SIZE=24576
