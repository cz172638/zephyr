# Router: wan with DHCP, lan0+lan1 bridged in the switch with a DHCP
# server, IPv4 forwarding without NAT. With the DSA and port name snippets:
#   west build ... -S espressobin-dsa -S espressobin-dsa-v7 \
#       -- -DEXTRA_CONF_FILE=router.conf
# with gPTP on wan, lan0 and lan1: -DEXTRA_CONF_FILE="router.conf;gptp.conf"
CONFIG_NETSHELL_ROUTER=y
CONFIG_NET_ETHERNET_BRIDGE=y
CONFIG_NET_ETHERNET_BRIDGE_SHELL=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_DHCPV4_SERVER_ADDR_COUNT=32
CONFIG_NET_IPV4_ROUTE=y
CONFIG_NET_IPV4_FORWARDING=y
# eth0, swp0, wan, lan0, lan1, bridge
CONFIG_NET_IF_MAX_IPV4_COUNT=6
# mDNS takes a UDP context and connection handler per interface; with
# the DHCP client and server, SSH and fwupdate the default 4 handlers run
# out and the DHCP server fails with -ENOENT
CONFIG_NET_MAX_CONN=24
CONFIG_NET_MAX_CONTEXTS=32
CONFIG_ZVFS_OPEN_MAX=32
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=128
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=256
