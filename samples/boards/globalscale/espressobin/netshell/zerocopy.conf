# NETA zero copy: RX into net_bufs handed to the stack, TX from the
# packet's own fragments. Full size net_bufs keep a frame in one or two
# fragments; more TX descriptors for the per-fragment descriptors.
#   -DEXTRA_CONF_FILE="router.conf;gptp.conf;zerocopy.conf"
#   mvneta_zc        counters (zero copy vs. copied) and RX pool
CONFIG_ETH_MVNETA_ZERO_COPY=y
CONFIG_ETH_MVNETA_TX_DESCS=128
CONFIG_NET_BUF_DATA_SIZE=1536
CONFIG_NET_BUF_POOL_USAGE=y
# throughput: zperf udp/tcp upload/download
CONFIG_NET_ZPERF=y
