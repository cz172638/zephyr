# Headless ESPRESSObin: DHCP, SSH shell, firmware update over TCP.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
# DHCP sends the name, mDNS answers <name>.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="espressobin"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_NET_HOSTNAME_UNIQUE_UPDATE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_ZVFS_POLL_MAX=10
CONFIG_ZVFS_OPEN_MAX=16

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y

# SSH server with shell backend; host key kept in settings (NVS)
CONFIG_SSH_SERVER=y
CONFIG_SSH_SERVER_MAX_CLIENTS=2
CONFIG_SSH_MAX_CHANNELS=2
CONFIG_SSH_MAX_HOST_KEYS=2
CONFIG_MBEDTLS=y
CONFIG_MAIN_STACK_SIZE=16384

# No hardware RNG driver for the Armada 3700 yet
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_FWUPDATE=y
CONFIG_FWUPDATE_TCP=y

CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_MVNETA_SHELL=y
