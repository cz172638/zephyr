# Headless ESPRESSObin: DHCP, SSH shell, firmware update over TCP.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
# DHCP sends the name, mDNS answers <name>.local
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="espressobin"
CONFIG_NET_HOSTNAME_UNIQUE=y
CONFIG_NET_HOSTNAME_UNIQUE_UPDATE=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MAX_CONTEXTS=12
# UDP/TCP handlers: mDNS per interface, DHCP, SSH, fwupdate (default 4)
CONFIG_NET_MAX_CONN=16
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=128
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_ZVFS_POLL_MAX=10
CONFIG_ZVFS_OPEN_MAX=16

CONFIG_SHELL=y
CONFIG_NET_SHELL=y
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_KERNEL_SHELL=y
CONFIG_REBOOT=y
CONFIG_LOG=y

# SSH server with shell backend; host key kept in settings (NVS)
CONFIG_SSH_SERVER=y
CONFIG_SSH_SERVER_MAX_CLIENTS=2
CONFIG_SSH_MAX_CHANNELS=2
CONFIG_SSH_MAX_HOST_KEYS=2
CONFIG_MBEDTLS=y
CONFIG_MAIN_STACK_SIZE=16384
# ssh <board> '<command>', and scp -O image <board>:/fw (fwupdate)
CONFIG_SHELL_SSH_EXEC=y
CONFIG_SHELL_SSH_SCP=y
CONFIG_SHELL_DUMMY_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_PROMPT_DUMMY=""
# Bigger channel buffers: the window is topped up at half, scp streams
CONFIG_SSH_CHANNEL_BUF_SIZE=8192

# No hardware RNG driver for the Armada 3700 yet
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SHELL=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

CONFIG_FWUPDATE=y
CONFIG_FWUPDATE_TCP=y

CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_ETH_MVNETA_SHELL=y
CONFIG_PHY_MARVELL_MV88E6XXX_SHELL=y
CONFIG_PHY_MARVELL_MV88E6XXX_TCAM=y

# "top": per thread / per CPU runtime statistics
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE_ALL=y
