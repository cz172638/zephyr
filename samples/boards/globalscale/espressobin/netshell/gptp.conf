# gPTP (802.1AS) on the DSA ports, with -S espressobin-dsa:
#   west build ... -S espressobin-dsa -- -DEXTRA_CONF_FILE=gptp.conf
# "net gptp" in the shell shows the port states and statistics.
CONFIG_NET_GPTP=y
CONFIG_NET_GPTP_NUM_PORTS=3
CONFIG_NET_GPTP_STATISTICS=y
CONFIG_NET_GPTP_GM_CAPABLE=y
CONFIG_PTP_CLOCK_SHELL=y
