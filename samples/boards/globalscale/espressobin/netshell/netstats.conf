# Network statistics for debugging stalls:
#   net stats [iface|all]   per interface counters (IP, TCP, UDP, errors)
#   net mem                 net_pkt slabs and net_buf pools in use
#   net allocs              net_pkt/net_buf currently allocated, by caller
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_PER_INTERFACE=y
CONFIG_NET_STATISTICS_ETHERNET=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_BUF_POOL_USAGE=y
CONFIG_NET_DEBUG_NET_PKT_ALLOC=y
