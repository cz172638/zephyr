CONFIG_ZTEST=y
CONFIG_PCIE_ENDPOINT=y
CONFIG_PCIE_EPC=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_RAM=y
CONFIG_LOG=y
CONFIG_PCIE_EP_LOG_LEVEL_INF=y
CONFIG_PCIE_EPF_NVME_MAX_IO_QUEUES=4
CONFIG_PCIE_EPF_NVME_MDTS_KB=32
# simulated time only moves when every thread sleeps
CONFIG_PCIE_EPF_NVME_BUSY_POLL_MS=0
CONFIG_PCIE_EPF_NVME_IDLE_POLL_US=100
CONFIG_PCIE_EPF_NVME_CC_POLL_MS=1
CONFIG_ZTEST_STACK_SIZE=8192
