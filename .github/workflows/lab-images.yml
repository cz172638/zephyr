#
# Lab images of the epc branch (ESPRESSObin, ROCK Pi 4; later K1, A527,
# A733, LS1012A) in the Zephyr CI container.
# Each board is scripts/ci/lab/<board>.sh; the same script runs locally.
#
# Repository variable (not secret): NETSHELL_AUTHORIZED_KEY, PEM public key
# for the ESPRESSObin netshell (ssh-keygen -e -m PKCS8 -f ~/.ssh/id_rsa.pub).
#
# Every build is one image number for all boards (the LLEXT prefix too):
# the highest lab-build-<n> tag + 1 (at least 154), or the "img" input.
# The release is tagged lab-build-<n> and kept, so each number stays
# downloadable.

name: lab-images

on:
  push:
    branches: [epc]
    paths:
      - 'arch/**'
      - 'boards/**'
      - 'drivers/**'
      - 'dts/**'
      - 'include/**'
      - 'kernel/**'
      - 'lib/**'
      - 'samples/boards/**'
      - 'scripts/ci/lab/**'
      - 'scripts/rockchip/**'
      - 'snippets/**'
      - 'soc/**'
      - 'subsys/**'
      - 'west.yml'
      - '.github/workflows/lab-images.yml'
  workflow_dispatch:
    inputs:
      boards:
        description: 'boards (space separated)'
        default: 'espressobin rock_pi_4'
      release:
        description: 'publish as release lab-build-<n> (push always does)'
        type: boolean
        default: true
      img:
        description: 'image number (empty: last lab-build tag + 1)'
        default: ''

concurrency:
  group: lab-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  number:
    runs-on: ubuntu-24.04
    outputs:
      img: ${{ steps.n.outputs.img }}
    steps:
      - id: n
        env:
          IMG_IN: ${{ github.event.inputs.img }}
        run: |
          if [ -n "$IMG_IN" ]; then
            n=$IMG_IN
          else
            last=$(git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" 'lab-build-*' |
                   sed -n 's|.*refs/tags/lab-build-\([0-9]*\)$|\1|p' | sort -n | tail -1)
            n=$(( ${last:-153} + 1 ))
            [ "$n" -ge 154 ] || n=154
          fi
          echo "image number $n"
          echo "img=$n" >> "$GITHUB_OUTPUT"

  build:
    needs: number
    runs-on: ubuntu-24.04
    container:
      # matches the ci-repo-cache tag of .github/workflows/twister.yaml (SDK 1.0.1)
      image: ghcr.io/zephyrproject-rtos/ci:v0.29.4
    strategy:
      fail-fast: false
      matrix:
        board: [espressobin, rock_pi_4]
    env:
      WS: ${{ github.workspace }}/ws
      OUT: ${{ github.workspace }}/out
      NETSHELL_AUTHORIZED_KEY: ${{ vars.NETSHELL_AUTHORIZED_KEY }}
      IMG: ${{ needs.number.outputs.img }}
    steps:
      - name: selected
        id: sel
        shell: bash
        run: |
          b=" ${{ github.event.inputs.boards || 'espressobin rock_pi_4' }} "
          [[ $b == *" ${{ matrix.board }} "* ]] && echo run=1 >> "$GITHUB_OUTPUT" || true

      - name: checkout
        if: steps.sel.outputs.run
        uses: actions/checkout@v4
        with:
          path: ws/zephyr
          fetch-depth: 1

      - name: cache modules and firmware trees
        if: steps.sel.outputs.run
        uses: actions/cache@v4
        with:
          path: |
            ws/modules
            ws/fw
          key: lab-${{ matrix.board }}-${{ hashFiles('ws/zephyr/west.yml', format('ws/zephyr/scripts/ci/lab/{0}.sh', matrix.board), 'ws/zephyr/scripts/ci/lab/common.sh') }}

      - name: build
        if: steps.sel.outputs.run
        shell: bash
        run: bash -eu ws/zephyr/scripts/ci/lab/${{ matrix.board }}.sh

      - name: upload
        if: steps.sel.outputs.run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}-images
          path: out/
          retention-days: 30

  release:
    if: ${{ !cancelled() && needs.number.result == 'success' && (github.event_name == 'push' || github.event.inputs.release == 'true') }}
    needs: [number, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: release lab-build-${{ needs.number.outputs.img }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: lab-build-${{ needs.number.outputs.img }}
        run: |
          for d in dl/*-images; do
            b=$(basename "$d" -images)
            mv "$d/README.md" "$d/README-$b.md"
            mv "$d/SHA256SUMS" "$d/SHA256SUMS-$b"
          done
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Lab build ${TAG#lab-build-} from ${GITHUB_REF_NAME} ${GITHUB_SHA::12}" dl/*/*
          # the per-branch scheme before numbered builds
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --json tagName -q '.[].tagName' | grep '^lab-images-' || true); do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" -y --cleanup-tag
          done
