#
# RK3308 over SWD. Debug component offsets: TRM v1.1 Part1, table 14-1
# (APB-AP view at 0x80000000). Select the adapter on the command line, e.g.
#   west debug --cmd-pre-init "source [find interface/cmsis-dap.cfg]"
# or set OPENOCD_INTERFACE in the environment.

if { [info exists ::env(OPENOCD_INTERFACE)] } {
	source [find interface/$::env(OPENOCD_INTERFACE).cfg]
}

transport select swd
adapter speed 4000

set _CHIPNAME rk3308
swd newdap $_CHIPNAME cpu -enable
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set _CTIBASE {0x80018000 0x80019000 0x8001a000 0x8001b000}

set _smp_cmd "target smp"
for { set _core 0 } { $_core < 4 } { incr _core } {
	set _TARGETNAME $_CHIPNAME.a35.$_core
	cti create $_CHIPNAME.cti.$_core -dap $_CHIPNAME.dap -ap-num 0 \
		-baseaddr [lindex $_CTIBASE $_core]
	target create $_TARGETNAME aarch64 -dap $_CHIPNAME.dap -ap-num 0 \
		-dbgbase [lindex $_DBGBASE $_core] \
		-cti $_CHIPNAME.cti.$_core -coreid $_core
	if { $_core != 0 } {
		$_TARGETNAME configure -defer-examine
	}
	append _smp_cmd " $_TARGETNAME"
}
eval $_smp_cmd
targets $_CHIPNAME.a35.0

# Loads are done with the D-cache/MMU off (U-Boot "dcache off" or halted
# before Zephyr enables the MMU): APB-AP writes bypass the CPU caches.
$_CHIPNAME.a35.0 configure -event gdb-attach { halt }

# --- Load/run Zephyr over OpenOCD -------------------------------------------
# DRAM must already be up: let the boot chain reach BL31 (or a U-Boot prompt),
# halt, and at a U-Boot prompt run "dcache flush; dcache off" first so the
# image lands in DRAM and not a dirty cache line. BL31 stays resident at
# 0x00000000-0x000fffff, so Zephyr enters as BL33 with PSCI still available.
#
# Telnet console:   rk3308_load_zephyr /path/to/zephyr.bin ; resume
# GDB:              use support/rock_pi_s.gdb (loads zephyr.elf with symbols)

proc rk3308_load_zephyr {binfile {addr 0x02000000}} {
	targets rk3308.a35.0
	halt
	load_image $binfile $addr bin
	reg pc $addr
	echo "zephyr: loaded [file tail $binfile] at $addr, pc set (resume to run)"
}

proc rk3308_run_zephyr {binfile {addr 0x02000000}} {
	rk3308_load_zephyr $binfile $addr
	resume
}
